server {
  listen 80;
  server_name www.oakbase.ai;

  location ~ ^/(legal|terms|privacy|security|security/reporting|subprocessors|law-firms|wealth-management|operations/time-capture)$ {
    return 301 https://oakbase.ai$uri/;
  }

  location = /industries {
    return 301 https://oakbase.ai/#industries;
  }

  location = /industries.html {
    return 301 https://oakbase.ai/#industries;
  }

  location / {
    return 301 https://oakbase.ai$request_uri;
  }
}

server {
  listen 80;
  server_name agentialabs.ai www.agentialabs.ai;

  location ~ ^/(legal|terms|privacy|security|security/reporting|subprocessors|law-firms|wealth-management|operations/time-capture)$ {
    return 301 https://oakbase.ai$uri/;
  }

  location = /industries {
    return 301 https://oakbase.ai/#industries;
  }

  location = /industries.html {
