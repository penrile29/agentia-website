    return 301 https://oakbase.ai$request_uri;
  }
}

server {
  listen 80 default_server;
  server_name oakbase.ai _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  # nginx always compresses text/html when gzip is enabled.
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/xml
    text/xml
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  error_page 404 /404.html;

  location = /404.html {
    internal;
    expires -1;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    try_files $uri =404;
    expires -1;
  }

  location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
    expires -1;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
    expires -1;
  }

  location = /llms-full.txt {
    default_type text/plain;
    try_files $uri =404;
    expires -1;
  }

  location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
    expires -1;
  }

  # Defence in depth: internal legal work never belongs in the public web root.
  location = /legal/evidence { return 404; }
  location ^~ /legal/evidence/ { return 404; }
  location = /legal/private { return 404; }
  location ^~ /legal/private/ { return 404; }
  location = /docs/private { return 404; }
  location ^~ /docs/private/ { return 404; }
  location = /tools { return 404; }
  location ^~ /tools/ { return 404; }

  # Canonical, single-hop redirects. Traefik terminates TLS before nginx, so
  # these redirects deliberately use the public HTTPS origin.
  location = /legal { return 301 https://oakbase.ai/legal/; }
  location = /terms { return 301 https://oakbase.ai/terms/; }
  location = /privacy { return 301 https://oakbase.ai/privacy/; }
  location = /security { return 301 https://oakbase.ai/security/; }
  location = /security/reporting { return 301 https://oakbase.ai/security/reporting/; }
  location = /subprocessors { return 301 https://oakbase.ai/subprocessors/; }
  location = /law-firms { return 301 https://oakbase.ai/law-firms/; }
  location = /wealth-management { return 301 https://oakbase.ai/wealth-management/; }
  location = /operations/time-capture { return 301 https://oakbase.ai/operations/time-capture/; }

  # Public documents and commercial landing pages are static routes. Missing
  # files within them return a real 404 rather than the marketing homepage.
  location /legal/ { try_files $uri $uri/ =404; expires -1; }
  location /terms/ { try_files $uri $uri/ =404; expires -1; }
  location /privacy/ { try_files $uri $uri/ =404; expires -1; }
  location /security/ { try_files $uri $uri/ =404; expires -1; }
  location /subprocessors/ { try_files $uri $uri/ =404; expires -1; }
  location /law-firms/ { try_files $uri $uri/ =404; expires -1; }
  location /wealth-management/ { try_files $uri $uri/ =404; expires -1; }
  location /operations/time-capture/ { try_files $uri $uri/ =404; expires -1; }

  location = / {
    try_files /index.html =404;
    expires -1;
  }

  location = /industries {
    return 301 https://oakbase.ai/#industries;
  }

  location = /industries.html {
    return 301 https://oakbase.ai/#industries;
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
  }

  location ~* \.(?:css|js)$ {
    try_files $uri =404;
    expires 1h;
  }

  location / {
    try_files $uri =404;
    expires -1;
  }
}
