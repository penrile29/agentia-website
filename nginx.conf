server {
  listen 80;
  server_name www.oakbase.ai;

  location = /industries {
    return 301 https://oakbase.ai/#industries;
  }

  location = /industries.html {
    return 301 https://oakbase.ai/#industries;
  }

  location / {
    return 301 https://oakbase.ai$request_uri;
  }
}

server {
  listen 80;
  server_name agentialabs.ai www.agentialabs.ai;

  location = /industries {
    return 301 https://oakbase.ai/#industries;
  }

  location = /industries.html {
    return 301 https://oakbase.ai/#industries;
  }

  location / {
    return 301 https://oakbase.ai$request_uri;
  }
}

server {
  listen 80 default_server;
  server_name oakbase.ai _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  # Defence in depth: internal legal work never belongs in the public web root.
  location = /legal/evidence { return 404; }
  location ^~ /legal/evidence/ { return 404; }
  location = /legal/private { return 404; }
  location ^~ /legal/private/ { return 404; }
  location = /docs/private { return 404; }
  location ^~ /docs/private/ { return 404; }
  location = /tools { return 404; }
  location ^~ /tools/ { return 404; }

  # Legal documents are static routes. Missing files must return 404 instead
  # of silently falling back to the marketing homepage.
  location ^~ /legal/ { try_files $uri $uri/ =404; }
  location ^~ /terms/ { try_files $uri $uri/ =404; }
  location ^~ /privacy/ { try_files $uri $uri/ =404; }
  location ^~ /security/ { try_files $uri $uri/ =404; }
  location ^~ /subprocessors/ { try_files $uri $uri/ =404; }

  location = / {
    try_files /index.html =404;
  }

  location = /industries {
    return 301 https://oakbase.ai/#industries;
  }

  location = /industries.html {
    return 301 https://oakbase.ai/#industries;
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
