services:
  website:
    image: nginx:1.27-alpine
    container_name: agentia-website
    restart: unless-stopped
    command: >
      /bin/sh -lc '
      set -eu;
      BASE="https://raw.githubusercontent.com/penrile29/agentia-website/main";
      cd /usr/share/nginx/html;
      rm -rf ./*;
      mkdir -p assets/logos;
      wget -q -O /etc/nginx/conf.d/default.conf "$$BASE/nginx.conf";
      wget -q -O index.html "$$BASE/index.html";
      wget -q -O industries.html "$$BASE/industries.html";
      wget -q -O styles.css "$$BASE/styles.css";
      wget -q -O robots.txt "$$BASE/robots.txt";
      wget -q -O sitemap.xml "$$BASE/sitemap.xml";
      wget -q -O assets/agentia-mark-h.svg "$$BASE/assets/agentia-mark-h.svg";
      wget -q -O assets/agentia-mark-h-light.svg "$$BASE/assets/agentia-mark-h-light.svg";
      wget -q -O assets/favicon.svg "$$BASE/assets/favicon.svg";
      wget -q -O assets/og-image.png "$$BASE/assets/og-image.png";
      wget -q -O assets/workspace.png "$$BASE/assets/workspace.png";
      wget -q -O assets/workspace.webp "$$BASE/assets/workspace.webp";
      wget -q -O assets/agent-chat.png "$$BASE/assets/agent-chat.png";
      wget -q -O assets/agent-chat.webp "$$BASE/assets/agent-chat.webp";
      wget -q -O assets/agent-chat-es.png "$$BASE/assets/agent-chat-es.png";
      wget -q -O assets/agent-chat-es.webp "$$BASE/assets/agent-chat-es.webp";
      wget -q -O assets/agent-email.png "$$BASE/assets/agent-email.png";
      wget -q -O assets/agent-email.webp "$$BASE/assets/agent-email.webp";
      wget -q -O assets/agent-email-es.png "$$BASE/assets/agent-email-es.png";
      wget -q -O assets/agent-email-es.webp "$$BASE/assets/agent-email-es.webp";
      wget -q -O assets/logos/anthropic.svg "$$BASE/assets/logos/anthropic.svg";
      wget -q -O assets/logos/google.svg "$$BASE/assets/logos/google.svg";
      wget -q -O assets/logos/meta.svg "$$BASE/assets/logos/meta.svg";
      wget -q -O assets/logos/openai-mark.svg "$$BASE/assets/logos/openai-mark.svg";
      printf "ok\n" > health;
      exec nginx -g "daemon off;";
      '
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.agentia-website.rule=Host(`${DOMAIN:-agentialabs.ai}`) || Host(`www.${DOMAIN:-agentialabs.ai}`)"
      - "traefik.http.routers.agentia-website.entrypoints=websecure"
      - "traefik.http.routers.agentia-website.tls=true"
      - "traefik.http.routers.agentia-website.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agentia-website.priority=20"
      - "traefik.http.services.agentia-website.loadbalancer.server.port=80"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
