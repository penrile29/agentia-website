services:
  website:
    image: nginx:1.27-alpine
    container_name: oakbase-website
    restart: unless-stopped
    environment:
      CONTENT_REF: "${CONTENT_REF:?CONTENT_REF is required}"
    command: >
      /bin/sh -lc '
      set -eu;
      CONTENT_REF="$${CONTENT_REF:?CONTENT_REF is required}";
      BASE="https://raw.githubusercontent.com/penrile29/agentia-website/$$CONTENT_REF";
      cd /usr/share/nginx/html;
      rm -rf ./.well-known ./*;
      mkdir -p .well-known assets/fonts assets/logos law-firms legal operations/time-capture privacy security/reporting subprocessors terms wealth-management;
      wget -q -O /etc/nginx/conf.d/default.conf "$$BASE/nginx.conf";
      wget -q -O index.html "$$BASE/index.html";
      wget -q -O 404.html "$$BASE/404.html";
      wget -q -O agentic.css "$$BASE/agentic.css";
      wget -q -O commercial.css "$$BASE/commercial.css";
      wget -q -O site.js "$$BASE/site.js";
      wget -q -O industries.html "$$BASE/industries.html";
      wget -q -O styles.css "$$BASE/styles.css";
      wget -q -O robots.txt "$$BASE/robots.txt";
      wget -q -O sitemap.xml "$$BASE/sitemap.xml";
      wget -q -O llms.txt "$$BASE/llms.txt";
      wget -q -O llms-full.txt "$$BASE/llms-full.txt";
      wget -q -O assets/oakbase-mark-h.svg "$$BASE/assets/oakbase-mark-h.svg";
      wget -q -O assets/oakbase-mark-h-light.svg "$$BASE/assets/oakbase-mark-h-light.svg";
      wget -q -O assets/favicon.svg "$$BASE/assets/favicon.svg";
      wget -q -O assets/og-image.png "$$BASE/assets/og-image.png";
      wget -q -O assets/workspace.png "$$BASE/assets/workspace.png";
      wget -q -O assets/workspace.webp "$$BASE/assets/workspace.webp";
      wget -q -O assets/agent-chat.png "$$BASE/assets/agent-chat.png";
      wget -q -O assets/agent-chat.webp "$$BASE/assets/agent-chat.webp";
      wget -q -O assets/agent-chat-es.png "$$BASE/assets/agent-chat-es.png";
      wget -q -O assets/agent-chat-es.webp "$$BASE/assets/agent-chat-es.webp";
      wget -q -O assets/agent-email.png "$$BASE/assets/agent-email.png";
      wget -q -O assets/agent-email.webp "$$BASE/assets/agent-email.webp";
      wget -q -O assets/agent-email-es.png "$$BASE/assets/agent-email-es.png";
      wget -q -O assets/agent-email-es.webp "$$BASE/assets/agent-email-es.webp";
      wget -q -O assets/logos/anthropic.svg "$$BASE/assets/logos/anthropic.svg";
      wget -q -O assets/logos/clio.svg "$$BASE/assets/logos/clio.svg";
      wget -q -O assets/logos/google.svg "$$BASE/assets/logos/google.svg";
      wget -q -O assets/logos/hubspot.svg "$$BASE/assets/logos/hubspot.svg";
      wget -q -O assets/logos/meta.svg "$$BASE/assets/logos/meta.svg";
      wget -q -O assets/logos/microsoft.svg "$$BASE/assets/logos/microsoft.svg";
      wget -q -O assets/logos/onedrive.svg "$$BASE/assets/logos/onedrive.svg";
      wget -q -O assets/logos/openai-mark.svg "$$BASE/assets/logos/openai-mark.svg";
      wget -q -O assets/logos/salesforce.svg "$$BASE/assets/logos/salesforce.svg";
      wget -q -O assets/logos/sharepoint.svg "$$BASE/assets/logos/sharepoint.svg";
      wget -q -O assets/fonts/ibm-plex-mono-400-latin.woff2 "$$BASE/assets/fonts/ibm-plex-mono-400-latin.woff2";
      wget -q -O assets/fonts/ibm-plex-mono-500-latin.woff2 "$$BASE/assets/fonts/ibm-plex-mono-500-latin.woff2";
      wget -q -O assets/fonts/inter-tight-latin.woff2 "$$BASE/assets/fonts/inter-tight-latin.woff2";
      wget -q -O assets/fonts/material-symbols-outlined.woff2 "$$BASE/assets/fonts/material-symbols-outlined.woff2";
      wget -q -O legal/index.html "$$BASE/legal/index.html";
      wget -q -O legal/legal.css "$$BASE/legal/legal.css";
      wget -q -O legal/legal.js "$$BASE/legal/legal.js";
      wget -q -O law-firms/index.html "$$BASE/law-firms/index.html";
      wget -q -O wealth-management/index.html "$$BASE/wealth-management/index.html";
      wget -q -O operations/time-capture/index.html "$$BASE/operations/time-capture/index.html";
      wget -q -O terms/index.html "$$BASE/terms/index.html";
      wget -q -O privacy/index.html "$$BASE/privacy/index.html";
      wget -q -O security/index.html "$$BASE/security/index.html";
      wget -q -O security/reporting/index.html "$$BASE/security/reporting/index.html";
      wget -q -O subprocessors/index.html "$$BASE/subprocessors/index.html";
      wget -q -O .well-known/security.txt "$$BASE/.well-known/security.txt";
      printf "ok\n" > health;
      exec nginx -g "daemon off;";
      '
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oakbase-website.rule=Host(`${DOMAIN:-oakbase.ai}`) || Host(`www.${DOMAIN:-oakbase.ai}`) || Host(`${LEGACY_DOMAIN:-agentialabs.ai}`) || Host(`www.${LEGACY_DOMAIN:-agentialabs.ai}`)"
      - "traefik.http.routers.oakbase-website.entrypoints=websecure"
      - "traefik.http.routers.oakbase-website.tls=true"
      - "traefik.http.routers.oakbase-website.tls.certresolver=letsencrypt"
      - "traefik.http.routers.oakbase-website.priority=20"
      - "traefik.http.services.oakbase-website.loadbalancer.server.port=80"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
