# Explicit language requests on legacy URLs survive the move to stable paths.
map $arg_lang $oakbase_lang {
  default en;
  es es;
  en en;
}

server {
  listen 80;
  server_name www.oakbase.ai;

  location ~ ^/law-firms/?$ { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform; }
  location ~ ^/wealth-management/?$ { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args; }
  location ~ ^/operations/time-capture/?$ { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#agents; }

  location ~ ^/(legal|terms|privacy|security|security/reporting|subprocessors)$ {
    return 301 https://oakbase.ai/$oakbase_lang$uri/$is_args$args;
  }

  location = /industries {
    return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform;
  }

  location = /industries.html {
    return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform;
  }

  location / {
    return 301 https://oakbase.ai$request_uri;
  }
}

server {
  listen 80;
  server_name agentialabs.ai www.agentialabs.ai;

  location ~ ^/law-firms/?$ { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform; }
  location ~ ^/wealth-management/?$ { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args; }
  location ~ ^/operations/time-capture/?$ { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#agents; }

  location ~ ^/(legal|terms|privacy|security|security/reporting|subprocessors)$ {
    return 301 https://oakbase.ai/$oakbase_lang$uri/$is_args$args;
  }

  location = /industries {
    return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform;
  }

  location = /industries.html {
    return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform;
  }

  location / {
    return 301 https://oakbase.ai$request_uri;
  }
}

server {
  listen 80 default_server;
  server_name oakbase.ai _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  # nginx always compresses text/html when gzip is enabled.
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/xml
    text/xml
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  error_page 404 /404.html;

  location = /404.html {
    internal;
    expires -1;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    try_files $uri =404;
    expires -1;
  }

  location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
    expires -1;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
    expires -1;
  }

  location = /llms-full.txt {
    default_type text/plain;
    try_files $uri =404;
    expires -1;
  }

  location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
    expires -1;
  }

  # Defence in depth: internal legal work never belongs in the public web root.
  location = /legal/evidence { return 404; }
  location ^~ /legal/evidence/ { return 404; }
  location = /legal/private { return 404; }
  location ^~ /legal/private/ { return 404; }
  location = /docs/private { return 404; }
  location ^~ /docs/private/ { return 404; }
  location = /tools { return 404; }
  location ^~ /tools/ { return 404; }

  # The language is encoded in the URL, never selected from a crawler's locale.
  location ~ ^/(legal|terms|privacy|security|security/reporting|subprocessors)(?:/(?:index.html)?)?$ {
    return 301 https://oakbase.ai/$oakbase_lang/$1/$is_args$args;
  }
  location ~ ^/(es|en)(/(?:legal|terms|privacy|security|security/reporting|subprocessors))?$ {
    return 301 https://oakbase.ai$uri/$is_args$args;
  }
  location = /law-firms { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform; }
  location = /law-firms/ { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform; }
  location = /wealth-management { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args; }
  location = /wealth-management/ { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args; }
  location = /operations/time-capture { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#agents; }
  location = /operations/time-capture/ { return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#agents; }
  location = / {
    return 301 https://oakbase.ai/$oakbase_lang/$is_args$args;
  }
  location = /index.html {
    return 301 https://oakbase.ai/$oakbase_lang/$is_args$args;
  }

  location = /industries {
    return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform;
  }

  location = /industries.html {
    return 301 https://oakbase.ai/$oakbase_lang/$is_args$args#platform;
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
  }

  location ~* \.(?:css|js)$ {
    try_files $uri =404;
    expires 1h;
  }

  location / {
    try_files $uri $uri/ =404;
    expires -1;
  }
}
